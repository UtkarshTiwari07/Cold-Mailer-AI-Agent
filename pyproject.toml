[project]
name = "cold-mailer"
version = "0.1.0"
description = "Autonomous multi-agent recruitment outreach pipeline"
requires-python = ">=3.11"
dependencies = [
    # Agent runtime + LLM
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-ai-slim[openai]>=0.0.30",
    "litellm>=1.55",
    # Storage
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "redis>=5.2",
    # Worker
    "arq>=0.26",
    # Ingestion
    "openpyxl>=3.1",
    "pandas>=2.2",
    # Email validation
    "email-validator>=2.2",
    "dnspython>=2.7",
    # HTTP / crawl / search
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "ddgs>=9.0",
    # Web (approval queue)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    # Config / CLI / logging
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Heavier, optional at MVP. Install with: uv sync --extra full
full = [
    "crawl4ai>=0.4.0",
    "fastembed>=0.4",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "langfuse>=2.53",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
cold-mailer = "cold_mailer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cold_mailer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is handled by the formatter, not worth erroring on.
# B008: FastAPI's Depends()/Form() pattern requires call-in-default-arg.
# UP042: contracts/*.py mixes `str` into every enum deliberately (JSON/DB
#   serialization compatibility across Pydantic and asyncpg) — `StrEnum`
#   is a reasonable alternative but not a strict improvement here, and
#   rewriting seven enums for a style preference isn't worth the churn.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The asyncpg pool (core/db.py) is a process-global singleton bound to
# whichever event loop was live when it was first created. pytest-asyncio's
# default is a fresh loop per test, which orphans that pool after the first
# DB-touching test closes its loop ("RuntimeError: Event loop is closed" on
# every test after). Session-scoped loops keep one loop alive for the whole
# run, matching the pool's actual lifetime assumption.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
